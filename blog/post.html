<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Posts are served as real pages at /blog/<slug>.html, built by
         scripts/build-blog.js. This page only forwards older links that
         still use the ?post= query form. -->
    <meta name="robots" content="noindex, follow">
    <title>Redirecting | Sashank Silwal</title>
    <script>
    (function() {
      var slug = new URLSearchParams(window.location.search).get('post');
      var target = slug && /^[a-z0-9-]+$/.test(slug) ? '/blog/' + slug + '.html' : '/blog/';
      window.location.replace(target);
    })();
    </script>
</head>
<body>
    <p>Redirecting to the post. <a href="/blog/">Back to the blog</a> if nothing happens.</p>
</body>
</html>
